name: fjs-go Android APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build arm64 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # flutter_fjs 要求 Dart >=3.10（Flutter 3.38+）；3.44 起 CI 会拉到 material_ui/cupertino_ui
          # 拆分包，编译报 awaitNotRequired 未定义，先固定在与本地开发一致的 3.41（Dart 3.11.5）
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认值 "tools platform-tools" 里的 tools 包已被新版 cmdline-tools 移除，会直接失败
          packages: platform-tools

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Flutter pub get
        working-directory: examples/fjs-go
        run: flutter pub get

      - name: Analyze
        working-directory: examples/fjs-go
        run: flutter analyze

      - name: Test
        working-directory: examples/fjs-go
        run: flutter test

      - name: Build debug APK
        working-directory: examples/fjs-go
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build release APK
        working-directory: examples/fjs-go
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare release assets
        run: |
          mkdir -p dist-apk
          cp examples/fjs-go/build/app/outputs/flutter-apk/app-debug.apk dist-apk/fjs-go-debug-arm64.apk
          cp examples/fjs-go/build/app/outputs/flutter-apk/app-release.apk dist-apk/fjs-go-release-arm64.apk

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apk/fjs-go-debug-arm64.apk
            dist-apk/fjs-go-release-arm64.apk
