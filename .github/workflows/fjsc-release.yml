# Builds the prebuilt `fjsc` binaries that cannot be produced on a macOS dev
# machine, and bundles them for dropping into packages/fjsc/prebuilt/. Each
# target yields two binaries, one per engine flavor (spec 114): fjsc (primjs)
# and fjsc-quickjs.
#
# This workflow does NOT publish. npm requires an OTP for write actions on this
# account, and trusted publishing (OIDC) is configured per package on npmjs.com,
# so it cannot cover a package's first release. The release flow is:
#
#   1. run this workflow
#   2. download the `fjsc-prebuilt` artifact and unzip it into packages/fjsc/
#   3. node packages/fjsc/build.mjs --all      (macOS from source, rest from prebuilt)
#   4. npm publish each packages/fjsc/npm/fjsc-* locally, with the OTP
#
# prebuilt/ is gitignored: the binaries are release inputs, not sources.
#
# See docs/publishing.md.
name: Build fjsc binaries

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win32-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build fjsc
        run: node packages/fjsc/build.mjs ${{ matrix.target }}

      # both flavors (spec 114): each must compile and report its own engine —
      # 0.1.4 shipped a quickjs-ng build as bin/fjsc because nothing checked
      - name: Smoke test
        shell: bash
        run: |
          set -e
          DIR=packages/fjsc/npm/fjsc-${{ matrix.target }}/bin
          EXT=""
          [ "${{ matrix.target }}" = "win32-x64" ] && EXT=".exe"
          echo 'console.log(1 + 1)' > smoke.js
          for pair in fjsc:primjs-4.1.1 fjsc-quickjs:quickjs-ng-0.9.0; do
            BIN="$DIR/${pair%%:*}$EXT"
            ID="${pair#*:}"
            "$BIN" smoke.js smoke.fjsbundle | tee smoke.out
            test -s smoke.fjsbundle
            grep -q "engine $ID)" smoke.out || { echo "$BIN is not $ID"; exit 1; }
            rm smoke.fjsbundle
          done

      # laid out so the artifact unzips straight into packages/fjsc/
      - name: Stage
        shell: bash
        run: |
          set -e
          mkdir -p stage/prebuilt/${{ matrix.target }}
          cp packages/fjsc/npm/fjsc-${{ matrix.target }}/bin/* stage/prebuilt/${{ matrix.target }}/

      - uses: actions/upload-artifact@v4
        with:
          name: fjsc-${{ matrix.target }}
          path: stage
          if-no-files-found: error

  bundle:
    name: Bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: fjsc-*
          merge-multiple: true

      - name: List
        run: find merged -type f -exec ls -l {} \;

      # one artifact to download and unzip into packages/fjsc/
      - uses: actions/upload-artifact@v4
        with:
          name: fjsc-prebuilt
          path: merged
          if-no-files-found: error
