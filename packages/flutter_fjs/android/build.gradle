// The engine ships prebuilt (spec 090), built from ../native by
// tool/build-android.sh into the package's abi/ cache, one set per engine
// flavor (spec 091):
//   ../abi/<flavor>/android/<abi>/libfjs.so            the engine, always
//   ../abi/<flavor>/android/<abi>/libfjs_debugger.so   CDP inspector +
//                                                      transport, primjs only
// Nothing native is compiled here, so consumers need no NDK or CMake — Dart
// always opens libfjs.so and, in debug builds only, loads the debugger
// module on top (lib/src/ffi.dart).
//
// Engine flavor (spec 105): chosen HERE by pointing jniLibs at
// abi/<flavor>/android — never by copying files over this package, which
// lives in the shared pub cache for every host that depends on it. First
// match wins:
//   1. gradle property fjs.jsEngine   (-Pfjs.jsEngine=quickjs)
//   2. FJS_JS_ENGINE in the environment (@ufjs/cli sets it)
//   3. FJS_JS_ENGINE in Flutter's dart-defines (--dart-define), which
//      Flutter hands every gradle project as -Pdart-defines=<base64,...>
//   4. primjs
// Non-debug builds drop libfjs_debugger.so via the exclude below; set
// fjsKeepDebugger=true in gradle properties to keep it.
def flutterRoot = null
if (project.hasProperty('flutter.sdk')) {
    flutterRoot = project.property('flutter.sdk')
}

// Flutter fills gradle.startParameter.taskNames with the app's tasks, so a
// non-debug build ("flutter build apk/appbundle", "flutter run
// --release/--profile") shows a *release/profile* task here while `fjs run`
// / `flutter run` shows a debug one. Cheap, configuration-time detection —
// no task-graph surgery.
def fjsIsNonDebugBuild = gradle.startParameter.taskNames.any {
    def n = it.toLowerCase()
    n.contains('release') || n.contains('profile')
}
def fjsKeepDebugger = project.findProperty('fjsKeepDebugger') == 'true'

def fjsJsEngine = {
    def explicit = project.findProperty('fjs.jsEngine')
    if (explicit) return explicit.toString()
    def fromEnv = System.getenv('FJS_JS_ENGINE')
    if (fromEnv) return fromEnv
    def defines = project.findProperty('dart-defines')
    if (defines) {
        for (encoded in defines.toString().split(',')) {
            def decoded
            try {
                decoded = new String(encoded.decodeBase64(), 'UTF-8')
            } catch (IllegalArgumentException ignored) {
                continue
            }
            if (decoded.startsWith('FJS_JS_ENGINE=')) {
                return decoded.substring('FJS_JS_ENGINE='.length())
            }
        }
    }
    return 'primjs'
}()
if (!(fjsJsEngine in ['primjs', 'quickjs'])) {
    throw new GradleException(
        "flutter_fjs: unknown FJS_JS_ENGINE '${fjsJsEngine}' - expected primjs or quickjs")
}
def fjsEngineLibs = file("${projectDir}/../abi/${fjsJsEngine}/android")
if (!fjsEngineLibs.isDirectory()) {
    throw new GradleException(
        "flutter_fjs: engine flavor '${fjsJsEngine}' has no prebuilt libraries at ${fjsEngineLibs}")
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.flutterjs.flutter_fjs'
    compileSdkVersion 34
    ndkVersion = "28.2.13676358"

    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [fjsEngineLibs]
            if (fjsIsNonDebugBuild && !fjsKeepDebugger) {
                // non-debug ships the engine only; dropping this file is
                // what removes the debugger, since the engine holds no
                // inspector
                jniLibs.excludes += ['**/libfjs_debugger.so']
            }
        }
    }

    // Prebuilt .so files are already stripped; skip the NDK strip task so the
    // build does not require an NDK installation.
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/libfjs.so']
            keepDebugSymbols += ['**/libfjs_debugger.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
