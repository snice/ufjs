// The engine ships prebuilt (spec 090), built from ../native by
// tool/build-android.sh into the package's abi/ cache, one set per engine
// flavor (spec 091):
//   ../abi/<flavor>/android/<abi>/libfjs.so                   the engine
//   ../abi/<flavor>/android-debugger/<abi>/libfjs_debugger.so CDP inspector +
//                                                             transport,
//                                                             primjs only
// Nothing native is compiled here, so consumers need no NDK or CMake — Dart
// always opens libfjs.so and, in debug builds only, loads the debugger
// module on top (lib/src/ffi.dart).
//
// Engine flavor (spec 105): chosen HERE by pointing jniLibs at
// abi/<flavor>/android — never by copying files over this package, which
// lives in the shared pub cache for every host that depends on it. First
// match wins:
//   1. gradle property fjs.jsEngine   (-Pfjs.jsEngine=quickjs)
//   2. FJS_JS_ENGINE in the environment (@ufjs/cli sets it)
//   3. FJS_JS_ENGINE in Flutter's dart-defines (--dart-define), which
//      Flutter hands every gradle project as -Pdart-defines=<base64,...>
//   4. primjs
// The debugger module ships in the DEBUG build type only (spec 115): its
// directory is a jniLibs source dir of the `debug` source set, so release,
// profile and any custom build type never merge it. Set fjsKeepDebugger=true
// in gradle properties to put it in `main` instead (every build type).
//
// Why a source set and not a filter: AGP ignores filters on jniLibs source
// dirs — `jniLibs.excludes += '**/libfjs_debugger.so'` on `main` was a no-op
// (verified on AGP 8.11), which spec 105 exposed once the CLI stopped
// deleting the file. Why not the requested task names: one gradle call can
// build several variants, and Flutter adds the app's build types (profile
// included) to plugin projects, so the build type is the reliable signal.
// Why a separate directory: two source sets on the same <abi>/ dir would
// merge libfjs.so twice.
def flutterRoot = null
if (project.hasProperty('flutter.sdk')) {
    flutterRoot = project.property('flutter.sdk')
}

def fjsKeepDebugger = project.findProperty('fjsKeepDebugger') == 'true'

def fjsJsEngine = {
    def explicit = project.findProperty('fjs.jsEngine')
    if (explicit) return explicit.toString()
    def fromEnv = System.getenv('FJS_JS_ENGINE')
    if (fromEnv) return fromEnv
    def defines = project.findProperty('dart-defines')
    if (defines) {
        for (encoded in defines.toString().split(',')) {
            def decoded
            try {
                decoded = new String(encoded.decodeBase64(), 'UTF-8')
            } catch (IllegalArgumentException ignored) {
                continue
            }
            if (decoded.startsWith('FJS_JS_ENGINE=')) {
                return decoded.substring('FJS_JS_ENGINE='.length())
            }
        }
    }
    return 'primjs'
}()
if (!(fjsJsEngine in ['primjs', 'quickjs'])) {
    throw new GradleException(
        "flutter_fjs: unknown FJS_JS_ENGINE '${fjsJsEngine}' - expected primjs or quickjs")
}
def fjsEngineLibs = file("${projectDir}/../abi/${fjsJsEngine}/android")
if (!fjsEngineLibs.isDirectory()) {
    throw new GradleException(
        "flutter_fjs: engine flavor '${fjsJsEngine}' has no prebuilt libraries at ${fjsEngineLibs}")
}
// quickjs has no debugger module, so its directory may be absent
def fjsDebuggerLibs = file("${projectDir}/../abi/${fjsJsEngine}/android-debugger")
def fjsDebuggerDirs = fjsDebuggerLibs.isDirectory() ? [fjsDebuggerLibs] : []

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.flutterjs.flutter_fjs'
    compileSdkVersion 34
    ndkVersion = "28.2.13676358"

    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [fjsEngineLibs] + (fjsKeepDebugger ? fjsDebuggerDirs : [])
        }
        debug {
            // not also in `debug` when kept in `main`: the debug variant
            // would then merge two copies of the same file
            if (!fjsKeepDebugger) {
                jniLibs.srcDirs += fjsDebuggerDirs
            }
        }
    }

    // Prebuilt .so files are already stripped; skip the NDK strip task so the
    // build does not require an NDK installation.
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/libfjs.so']
            keepDebugSymbols += ['**/libfjs_debugger.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
