name: flutter_fjs_example
description: >-
  Minimal Flutter host for flutter_fjs: run a JS bundle built by @ufjs/cli
  as native widgets.
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_fjs:
    path: ../

flutter:
  uses-material-design: true
