name: flutter_fjs
description: >-
  JS/TS runtime for Flutter. Embeds QuickJS-ng with direct JSI-style JS<->C++
  calls, runs source or bytecode bundles, and renders HTML-like JS tags as
  Flutter widgets.
version: 0.1.7
repository: https://github.com/snice/ufjs
issue_tracker: https://github.com/snice/ufjs/issues
documentation: https://github.com/snice/ufjs#readme
topics:
  - javascript
  - typescript
  - quickjs
  - ffi
  - vue

environment:
  # Flutter 3.38 (Dart 3.10) is the floor for the whole repo: below it the
  # CFE crashes compiling a private `@Native` function that takes a
  # TypedData `.address` (fixed in Dart 3.10), which is what flutter_angle
  # 0.4.x does. The generated host's Gradle/AGP/KGP baseline assumes it too.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

# spec 091/105: `dart run flutter_fjs:engine <primjs|quickjs>` finishes an
# engine switch the build files cannot do alone — ohos libs and the host's
# pod install (android/ios/macos pick the flavor at build time and this
# package's directory is not modified for them). Pure Flutter hosts (fjs-go)
# run it by hand; @ufjs/cli runs it for `fjs run/build --js-engine`.
executables:
  engine:

dependencies:
  flutter:
    sdk: flutter
  # 4.x needs Flutter >=3.44 — left open so it is picked up on a newer
  # toolchain without forcing one here
  cached_network_image: ">=3.4.1 <5.0.0"
  ffi: ^2.2.0
  # NOTE: WebGL lives in the fjs-webgl module (spec 022), which owns the
  # flutter_angle dependency. The core has no GL dependency of its own.
  # Matrix4, for the CSS `transform` parser (style_parse.dart stays
  # widget-free, so it cannot get it from flutter/widgets.dart)
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        pluginClass: FlutterFjsPlugin
        package: dev.flutterjs.flutter_fjs
      ios:
        pluginClass: FlutterFjsPlugin
      macos:
        pluginClass: FlutterFjsPlugin
      # Only recognized by the OpenHarmony flutter fork; standard flutter
      # ignores unknown platform keys, so the package still resolves there.
      ohos:
        pluginClass: FlutterFjsPlugin
