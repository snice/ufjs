name: fjs_webgl
description: "Flutter side of the fjs module webgl: ANGLE-backed getContext('webgl'/'webgl2') for canvas nodes."
version: 0.1.4
publish_to: 'none'

environment:
  # flutter_angle 0.4.x asks for Dart ^3.8.1, but the real floor is 3.10:
  # its GL bindings call private `@Native` functions with a TypedData
  # `.address`, and the CFE crashes on that until Dart 3.10 / Flutter 3.38.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_fjs: ^0.1.4
  # 0.4.x drops the NativeArray wrapper (plain TypedData goes straight to
  # GL), adds Linux/web/wasm and iOS-simulator surfaces, and carries a much
  # newer ANGLE. Isolated to src/replay.dart — swap surface if it stalls.
  flutter_angle: ^0.4.2
  # ohos backend (src/ohos_surface.dart) calls libEGL directly; flutter_angle
  # already pulls this in, declared because we import it
  ffi: ^2.1.0

# flutter_angle has no ohos implementation, so ohos gets its own texture
# registration shim (ohos/, see FjsWebglPlugin.ets). Only the OpenHarmony
# flutter fork reads this key; android/ios stay plain Dart via flutter_angle.
flutter:
  plugin:
    platforms:
      ohos:
        pluginClass: FjsWebglPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter

# Only applies when this package is the root (pub ignores it for consumers),
# which is exactly when it is needed: the generated host gets flutter_fjs by
# path (see the autolink dependency_overrides), and `flutter test` here must
# resolve the same checkout to compile.
dependency_overrides:
  flutter_fjs:
    path: ../../flutter_fjs
