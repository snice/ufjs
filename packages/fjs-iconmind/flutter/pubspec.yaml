name: fjs_iconmind
description: "Flutter side of the fjs module iconmind: the widget behind <icon-mind />."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.5.4
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_fjs: ^0.1.4
  path_drawing: ^1.0.1

# No assets here on purpose: the icon data is generated per app by
# prepare.mjs, and fjs copies it into the Flutter host's own assets
# (assets/fjs/modules/iconmind/), which is what this package reads.
