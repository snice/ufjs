# JS side of the repo. The Flutter package (packages/flutter_fjs) and Flutter
# example apps are pub, not npm, and are skipped when they have no package.json.
packages:
  - 'packages/fjs'
  - 'packages/fjs-runtime'
  - 'packages/fjs-iconmind'
  - 'packages/fjs-webview'
  - 'packages/fjs-webgl'
  - 'packages/fjs-spine'
  - 'demo'
  - 'examples/*'
  - 'website'
